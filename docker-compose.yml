# Postgres 17 and the collector. Ports can be changed: COLLECTOR_PORT=8081 POSTGRES_PORT=55433 docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 3s
      retries: 20

  collector:
    build: collector
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANALYTICS_DATABASE_URL: postgres://analytics:analytics@db:5432/analytics
      ANALYTICS_SOURCES: my-site
      # ANALYTICS_SECRET: set a long random value in production
      # ANALYTICS_TRUST_PROXY: "1"   # behind a reverse proxy that sets X-Forwarded-For
    ports:
      - "${COLLECTOR_PORT:-8080}:8080"

volumes:
  data:
